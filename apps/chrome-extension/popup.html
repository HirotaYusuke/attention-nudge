<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Attention Nudge</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body class="popup">
    <main class="panel">
      <header>
        <h1>Attention Nudge</h1>
        <label class="switch">
          <input id="enabled" type="checkbox" />
          <span>ON</span>
        </label>
      </header>
      <section class="stats" aria-label="本日の状態">
        <div>
          <span class="label">今日の介入</span>
          <strong id="interventionCount">0</strong>
        </div>
        <div>
          <span class="label">離脱/復帰</span>
          <strong id="awayCount">0</strong>
        </div>
      </section>
      <button id="testNudge" type="button">このページで試す</button>
      <a href="options.html" target="_blank">設定を開く</a>
      <p id="status" role="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
